[package]
name = "music-studio-ai"
version = "0.1.2"
description = "Rust Music Studio AI: Formant-Preserving Pitch/Speed Shifter & Local ONNX Stem Separation"
edition = "2021"

# Single-Binary architecture to prevent AhnLab endpoint security from scanning multiple executables
[[bin]]
name = "music-studio-ai"
path = "src/main.rs"

[features]
# Default mode keeps build footprint minimal on corporate machines with AhnLab.
# Enable `--features desktop-tauri` when packaging the full Tauri v2 desktop installer (.msi / .exe).
default = []
desktop-tauri = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
# Pure-Rust audio & video container demuxing (MP3, WAV, FLAC, OGG, M4A, MP4, MKV, WEBM, MOV)
# No external ffmpeg.exe sidecar needed
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "vorbis", "aac", "isomp4", "mkv", "pcm"] }
hound = "3.5"
rubato = "0.15"

# Pure-Rust FFT and multi-dimensional tensor processing for STFT & Phase Vocoder
rustfft = "6.2"
realfft = "3.3"
ndarray = "0.17"
rayon = "1.10"

# Low-latency audio playback and lock-free ring buffer
cpal = "0.15"
rtrb = "0.3"

# ONNX Runtime with load-dynamic (uses Microsoft-signed onnxruntime.dll + DirectML)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml"] }

# Stage 4 Model Manager: HuggingFace HTTPS download (Windows SChannel native-tls, zero ring/openssl C build) & SHA-256 verification
ureq = { version = "3.1", default-features = false, features = ["native-tls"] }
sha2 = "0.10"

# Optional Tauri v2 Desktop Runtime (activated during desktop packaging with `--features desktop-tauri`)
tauri = { version = "2", optional = true , features = [] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
